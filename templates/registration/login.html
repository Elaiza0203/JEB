{% extends "base.html" %}
{% block title %}Sign In — JEB Photo Vault{% endblock %}

{% block content %}
<div style="max-width:420px; margin:4rem auto 0;">
  <div style="text-align:center; margin-bottom:2rem;">
    <h1 style="font-family:var(--font-display); font-size:2rem; color:var(--accent);">JEB Photo Vault</h1>
    <p style="color:var(--muted); margin-top:0.25rem;">Sign in to your account</p>
  </div>

  <div class="card" style="padding:2rem;">
    <form method="post">
      {% csrf_token %}
      {% if form.non_field_errors %}
        <div class="message error" style="margin-bottom:1rem;">{{ form.non_field_errors.0 }}</div>
      {% endif %}
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-input" autofocus required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-input" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; margin-top:0.5rem;">Sign In</button>
    </form>

    <p style="text-align:center; margin-top:1.5rem; font-size:0.875rem; color:var(--muted);">
      Don't have an account? <a href="{% url 'register' %}" style="color:var(--accent);">Register</a>
    </p>
  </div>
</div>
{% endblock %}
